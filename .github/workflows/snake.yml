# Redraws the contribution-graph snake in the README every day,
# using the same blue as the portfolio. Run it once by hand after setup:
# Actions tab -> "Contribution snake" -> Run workflow.
name: Contribution snake

on:
  schedule:
    - cron: "0 5 * * *" # every day at 05:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draw the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#06080d&color_dots=#ebedf0,#c6d4fb,#8eabf6,#4a78ef,#1d4ed8
            dist/github-snake-dark.svg?color_snake=#eef2f8&color_dots=#161b22,#0d2a6b,#1a43b0,#2459f0,#78a2ff

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
